message: "Saludos, Gorka\r\n\r\nHemos revisado tu empresa debido a proyectos recientes en tu sector.\r\n\r\nLas empresas como la tuya incrementan su posicionamiento en los buscadores cuando son mencionadas como noticia en medios digitales, \r\ny además, estar presente en estos medios aporta credibilidad ante clientes potenciales que investigan sobre ti en internet.\r\n\r\nNosotros nos encargamos tanto de la preparación de la noticia de tu negocio como de la distribución en los principales medios. \r\nTe garantizamos la publicación de la noticia.\r\n\r\nAdemás del posicionamiento, te permitirá destacar frente a la competencia y reforzar la confianza en tu marca.\r\n\r\nPuedo enseñarte casos de éxito parecidos al tuyo y ofrecerte publicaciones gratuitas.\r\n\r\n¿Podrías confirmarme tu número y te explico todo en menos de 5 minutos?"
