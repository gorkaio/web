message: "Propuesta para Gorka.\r\n\r\nHola, es un placer saludarte.\r\n\r\nTe escribo porque sería interesante comentar contigo la opción de que Gorka posicione en los primeros lugares de internet y que aparezca cada mes como noticia en cientos de periódicos digitales, con artículos reales dentro del periódico que no se marcan como publicidad y que no se borran.\r\n\r\nEstas noticias se publicarán en más de cuarenta periódicos de gran autoridad para mejorar el posicionamiento de tu web y la reputación. \r\n\r\n¿Podrías facilitarme un teléfono para aplicarte un mes gratuito?\r\n\r\nMuchas gracias."
